<style>
  :root{
    --navy-950:#05070A; --navy-900:#0A0F16; --navy-800:#111926; --navy-700:#1A2536; --navy-600:#253347;
    --gold:#22D3EE; --gold-deep:#0BA5C4; --gold-soft:#8CEEF9;
    --paper:#0A0E13; --card:#131920; --card-alt:#1A222B;
    --ink:#E7EDF3; --ink-soft:#93A1AF; --ink-faint:#5C6875;
    --line:#232C37; --line-soft:#1B222B;
    --ok:#34D399; --ok-bg:rgba(52,211,153,.14);
    --danger:#F87171; --danger-bg:rgba(248,113,113,.14);
    --warn:#FBBF24; --warn-bg:rgba(251,191,36,.14);
    --radius:16px; --radius-sm:11px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35), 0 1px 1px rgba(0,0,0,.25);
    --shadow-md:0 10px 30px -10px rgba(0,0,0,.6), 0 2px 8px -2px rgba(0,0,0,.4);
    --shadow-gold:0 0 20px -4px rgba(34,211,238,.5);
    --font-display: "Source Serif 4", ui-serif, Georgia, "Times New Roman", serif;
    --font-body: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", "Roboto Mono", Menlo, Consolas, monospace;
  }
  html[data-theme="light"]{
    --navy-950:#071427; --navy-900:#0B1F3A; --navy-800:#142A4D; --navy-700:#1D3A63; --navy-600:#2C4A78;
    --paper:#EAEFF5; --card:#FFFFFF; --card-alt:#E1E8F0;
    --ink:#152233; --ink-soft:#57697D; --ink-faint:#8A97A8;
    --line:#D6E0E9; --line-soft:#E4EBF1;
    --ok:#2F6E4F; --ok-bg:#E7F2EC; --danger:#8B2E2E; --danger-bg:#F7E9E7; --warn:#92640A; --warn-bg:#F7EED9;
    --shadow-sm:0 1px 2px rgba(11,31,58,.05), 0 1px 1px rgba(11,31,58,.04);
    --shadow-md:0 10px 26px -10px rgba(11,31,58,.22), 0 2px 6px -2px rgba(11,31,58,.08);
  }
  html[data-theme="light"] nav.tabbar{ background:rgba(255,255,255,.92); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 15% 0%, rgba(34,211,238,.06), transparent 45%), var(--paper);
    color:var(--ink); font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
    padding-bottom:82px; min-height:100vh;
  }
  ::selection{background:var(--gold); color:#04121A;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:4px;}
  button{font-family:inherit;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important;} }
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:fixed; inset:0; background:#fff; color:#000; padding:30px;}
  }

  header.app-header{
    background:linear-gradient(160deg,var(--navy-900) 0%, var(--navy-950) 100%); color:#fff;
    padding:20px 18px 22px; position:relative; overflow:hidden; border-bottom:3px solid var(--gold);
    box-shadow:var(--shadow-md), 0 1px 0 rgba(34,211,238,.3) inset;
  }
  .header-net{position:absolute; inset:0; width:100%; height:100%; opacity:.55;}
  .header-net circle{fill:var(--gold-soft);}
  .header-net circle.pulse{animation:nodepulse 3.2s ease-in-out infinite;}
  .header-net line{stroke:rgba(34,211,238,.28); stroke-width:1;}
  @keyframes nodepulse{ 0%,100%{opacity:.55; r:1.6;} 50%{opacity:1; r:2.6;} }
  header.app-header::before{ content:""; position:absolute; right:-60px; top:-60px; width:190px; height:190px; border-radius:50%; background:radial-gradient(circle, rgba(34,211,238,.18), transparent 68%); pointer-events:none; }
  header.app-header::after{ content:""; position:absolute; left:-20%; top:0; width:60%; height:2px; background:linear-gradient(90deg, transparent, rgba(34,211,238,.95), transparent); animation:scan 3.5s linear infinite; }
  @keyframes scan{ 0%{ left:-40%; } 100%{ left:110%; } }
  .header-row{position:relative; z-index:2; display:flex; align-items:center; gap:12px;}
  .header-icon{width:44px; height:44px; border-radius:12px; background:rgba(34,211,238,.14); border:1px solid rgba(34,211,238,.4); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .header-title{font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:.2px; margin:0;}
  .header-sub{font-size:12.5px; color:var(--gold-soft); margin-top:2px; opacity:.9;}
  .role-badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:99px; background:rgba(255,255,255,.1); margin-left:8px; vertical-align:middle;}
  .header-stats{position:relative; z-index:2; display:flex; gap:10px; margin-top:16px;}
  .hstat{flex:1; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:var(--radius-sm); padding:10px 12px;}
  .hstat b{display:block; font-size:19px; font-family:var(--font-display);}
  .hstat span{font-size:11px; color:var(--ink-soft);}

  main{padding:16px 14px 8px; max-width:640px; margin:0 auto;}
  .section-title{font-family:var(--font-display); font-size:16px; font-weight:700; margin:18px 2px 10px; display:flex; align-items:center; justify-content:space-between;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow-sm);}
  .searchbar{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px;}
  .searchbar input{flex:1; background:transparent; border:none; color:var(--ink); font-size:14.5px; outline:none;}
  .searchbar input::placeholder{color:var(--ink-faint);}
  .filter-row{display:flex; gap:8px; margin-top:10px; overflow-x:auto; padding-bottom:2px;}
  .chip{flex-shrink:0; padding:7px 13px; border-radius:999px; background:var(--card-alt); border:1px solid var(--line); color:var(--ink-soft); font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:5px;}
  .chip.active{background:rgba(34,211,238,.16); border-color:var(--gold); color:var(--gold-soft);}

  #scannerVideoWifi{ width:100%; border-radius:12px; background:#000; max-height:50vh; object-fit:cover; }
  .scanner-wrap-wifi{ position:relative; border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .scanner-frame-wifi{ position:absolute; inset:18% 12%; border:2px solid var(--gold); border-radius:12px; box-shadow:0 0 0 2000px rgba(0,0,0,.35); pointer-events:none; }

  .bulk-bar-wifi{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:rgba(34,211,238,.1); border:1px solid rgba(34,211,238,.3); border-radius:10px; padding:9px 12px; margin:10px 0; }
  .bulk-bar-wifi .bulk-count{ font-size:12.5px; font-weight:700; color:var(--gold-deep); }
  .bulk-bar-wifi .bulk-actions-inline{ display:flex; gap:6px; flex-wrap:wrap; }
  .bulk-bar-wifi button{ border:none; background:var(--card-alt); color:var(--ink); font-size:11.5px; font-weight:700; padding:7px 11px; border-radius:8px; cursor:pointer; }
  .bulk-bar-wifi button.danger-btn{ background:rgba(248,113,113,.14); color:var(--danger); }
  .wifi-card{ position:relative; }
  .wifi-card.bulk-mode-card{ padding-right:40px; cursor:pointer; }
  .wifi-card.bulk-mode-card .wc-toolbar, .wifi-card.bulk-mode-card .act-toggle, .wifi-card.bulk-mode-card .act-copy{ pointer-events:none; opacity:.5; }
  .wc-select-check{ position:absolute; top:12px; right:12px; width:22px; height:22px; border-radius:6px; border:2px solid var(--line); background:var(--card); display:flex; align-items:center; justify-content:center; z-index:2; font-size:13px; font-weight:800; color:#04121A; }
  .wc-select-check.checked{ background:var(--gold); border-color:var(--gold); }

  .group-header{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin:16px 2px 8px; display:flex; align-items:center; gap:6px; text-transform:uppercase; letter-spacing:.4px;}

  .wifi-list{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
  .wifi-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow-sm); position:relative;}
  .wifi-card.pinned{border-color:rgba(34,211,238,.4);}
  .wc-top{display:flex; align-items:flex-start; gap:10px;}
  .wc-icon{width:38px; height:38px; border-radius:10px; background:var(--ok-bg); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--ok);}
  .wc-name{font-weight:700; font-size:15px; color:var(--ink); display:flex; align-items:center; gap:6px;}
  .wc-loc{font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .wc-badges{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; justify-content:flex-end;}
  .badge{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--card-alt); color:var(--ink-soft); border:1px solid var(--line);}
  .badge.band{color:var(--gold-soft); border-color:rgba(34,211,238,.35); background:rgba(34,211,238,.08);}
  .wc-pass-row{display:flex; align-items:center; gap:8px; margin-top:11px; background:var(--navy-950); border:1px solid var(--line-soft); border-radius:10px; padding:9px 10px;}
  .wc-pass{font-family:var(--font-mono); font-size:14px; letter-spacing:.5px; flex:1; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .icon-btn{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--card-alt); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .icon-btn:active{transform:scale(.94);}
  .icon-btn.on{color:var(--gold); border-color:var(--gold);}
  .icon-btn:disabled{opacity:.35; cursor:not-allowed;}
  .wc-note{font-size:12px; color:var(--ink-faint); margin-top:8px; font-style:italic;}
  .wc-toolbar{display:flex; gap:6px; margin-top:11px; flex-wrap:wrap;}
  .wc-toolbar .icon-btn{width:auto; padding:0 10px; height:32px; gap:5px; font-size:11.5px; font-weight:600; color:var(--ink-soft);}
  .wc-toolbar .icon-btn.danger{color:var(--danger); border-color:rgba(248,113,113,.3);}
  .wc-toolbar .icon-btn.qr{color:var(--gold-soft); border-color:rgba(34,211,238,.3);}

  .empty-state{text-align:center; padding:44px 20px; color:var(--ink-faint);}
  .empty-state svg{opacity:.5; margin-bottom:10px;}
  .empty-state p{font-size:13.5px; margin:4px 0 0;}

  .fab{position:fixed; right:18px; bottom:92px; width:54px; height:54px; border-radius:50%; background:linear-gradient(160deg, var(--gold) 0%, var(--gold-deep) 100%); color:#04121A; border:none; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-gold), var(--shadow-md); cursor:pointer; z-index:40;}
  .fab:active{transform:scale(.94);}

  nav.tabbar{position:fixed; left:0; right:0; bottom:0; display:flex; background:rgba(10,14,19,.92); backdrop-filter:blur(14px); border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:50;}
  nav.tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--ink-faint); font-size:10.5px; font-weight:600; padding:5px 0; cursor:pointer;}
  nav.tabbar button.active{color:var(--gold-soft);}
  nav.tabbar button svg{width:21px; height:21px;}

  .modal-overlay{position:fixed; inset:0; background:rgba(4,6,10,.72); display:flex; align-items:flex-end; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s;}
  .modal-overlay.open{opacity:1; pointer-events:auto;}
  .modal-sheet{background:var(--navy-900); border-top-left-radius:20px; border-top-right-radius:20px; border:1px solid var(--line); border-bottom:none; width:100%; max-width:640px; max-height:88vh; overflow-y:auto; padding:16px 18px calc(20px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .25s cubic-bezier(.22,1,.36,1); color:var(--ink);}
  .modal-overlay.open .modal-sheet{transform:translateY(0);}
  .modal-sheet.centered{margin:auto; border-radius:20px; border-bottom:1px solid var(--line); max-width:380px;}
  .modal-overlay.centered-wrap{align-items:center;}
  .modal-handle{width:38px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 14px;}
  .modal-title{font-family:var(--font-display); font-size:18px; font-weight:700; margin-bottom:14px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%; background:var(--navy-950); border:1px solid var(--line); border-radius:10px; padding:11px 12px; color:var(--ink); font-size:14.5px; font-family:inherit; outline:none;}
  .field textarea{resize:vertical; min-height:60px;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--gold);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .pass-input-wrap{position:relative; display:flex; gap:6px;}
  .pass-input-wrap input{padding-right:40px; font-family:var(--font-mono);}
  .pass-input-wrap .icon-btn{position:absolute; right:5px; top:5px;}
  .gen-btn{flex-shrink:0; height:44px; padding:0 12px; border-radius:10px; border:1px solid rgba(34,211,238,.35); background:rgba(34,211,238,.1); color:var(--gold-soft); font-size:12px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .history-link{font-size:11.5px; color:var(--gold-soft); text-decoration:underline; cursor:pointer; margin-top:6px; display:inline-block;}
  .btn-primary{width:100%; padding:13px; border-radius:12px; border:none; background:linear-gradient(160deg, var(--gold), var(--gold-deep)); color:#04121A; font-weight:700; font-size:14.5px; cursor:pointer; margin-top:4px;}
  .btn-primary:active{transform:scale(.98);}
  .btn-secondary{width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--card-alt); color:var(--ink); font-weight:600; font-size:14px; cursor:pointer; margin-top:9px;}
  .btn-danger{width:100%; padding:12px; border-radius:12px; border:1px solid rgba(248,113,113,.3); background:var(--danger-bg); color:var(--danger); font-weight:700; font-size:14px; cursor:pointer; margin-top:9px;}
  .close-x{position:absolute; right:14px; top:14px; width:30px; height:30px; border-radius:50%; background:var(--card-alt); border:1px solid var(--line); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer;}

  .settings-item{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line-soft); gap:12px;}
  .settings-item:last-child{border-bottom:none;}
  .settings-item span{font-size:14px; font-weight:600;}
  .settings-item small{display:block; font-size:11.5px; color:var(--ink-faint); font-weight:400; margin-top:2px;}
  .theme-toggle{display:flex; background:var(--card-alt); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px;}
  .theme-toggle button{border:none; background:none; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .theme-toggle button.active{background:var(--gold); color:#04121A;}
  select.inline-select{background:var(--navy-950); border:1px solid var(--line); border-radius:8px; padding:7px 10px; color:var(--ink); font-size:12.5px;}
  .log-item{font-size:11.5px; color:var(--ink-soft); padding:8px 0; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; gap:8px;}
  .log-item:last-child{border-bottom:none;}
  .log-item b{color:var(--ink); font-weight:600;}
  .helptext{font-size:11.5px; color:var(--ink-faint); line-height:1.6; margin-top:4px;}

  #lockScreen{position:fixed; inset:0; background:var(--navy-950); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;}
  .lock-icon{width:64px; height:64px; border-radius:18px; background:rgba(34,211,238,.12); border:1px solid rgba(34,211,238,.35); display:flex; align-items:center; justify-content:center; margin-bottom:18px; color:var(--gold);}
  .lock-title{font-family:var(--font-display); font-size:19px; font-weight:700; color:var(--ink); margin-bottom:4px;}
  .lock-sub{font-size:13px; color:var(--ink-soft); margin-bottom:26px;}
  .lock-dots{display:flex; gap:14px; margin-bottom:24px;}
  .lock-dot{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--line); background:transparent;}
  .lock-dot.filled{background:var(--gold); border-color:var(--gold);}
  .lock-dot.shake{animation:shake .35s;}
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .lock-keypad{display:grid; grid-template-columns:repeat(3,64px); gap:14px;}
  .lock-key{width:64px; height:64px; border-radius:50%; background:var(--card); border:1px solid var(--line); color:var(--ink); font-size:20px; font-weight:600; cursor:pointer;}
  .lock-key:active{background:var(--card-alt);}
  .lock-key.ghost{background:transparent; border:none; color:var(--ink-soft); font-size:13px;}
  .lock-msg{font-size:12.5px; color:var(--danger); height:16px; margin-bottom:8px;}
  .lock-forgot{margin-top:20px; background:none; border:none; color:var(--gold-soft); font-size:12.5px; cursor:pointer; text-decoration:underline;}

  #toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px); background:var(--navy-800); color:var(--ink); border:1px solid var(--line); padding:11px 18px; border-radius:99px; font-size:13px; font-weight:600; box-shadow:var(--shadow-md); z-index:300; opacity:0; pointer-events:none; transition:all .25s;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  #qrCanvasWrap{display:flex; justify-content:center; padding:18px; background:#fff; border-radius:14px; margin:14px 0;}
  .install-banner{display:flex; align-items:center; gap:10px; background:linear-gradient(135deg, rgba(34,211,238,.14), rgba(34,211,238,.04)); border:1px solid rgba(34,211,238,.3); border-radius:12px; padding:11px 12px; margin-bottom:14px; font-size:12.5px; color:var(--gold-soft);}

  #printArea{display:none;}
  .print-card{text-align:center; font-family:Arial, sans-serif;}
  .print-card h2{margin:14px 0 4px;}
  .print-card .pw{font-family:monospace; font-size:20px; letter-spacing:1px; margin:6px 0;}
</style>
</head>
<body>

<div id="lockScreen" style="display:none;">
  <div class="lock-icon">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 20a1.6 1.6 0 100-3.2 1.6 1.6 0 000 3.2z" fill="currentColor"/><path d="M8.2 13.6a5.4 5.4 0 017.6 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5.2 10.6a9.6 9.6 0 0113.6 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </div>
  <div class="lock-title">WiFi Vault Terkunci</div>
  <div class="lock-sub" id="lockSub">Masukkan PIN untuk membuka aplikasi</div>
  <div class="lock-msg" id="lockMsg"></div>
  <div class="lock-dots" id="lockDots"></div>
  <div class="lock-keypad" id="lockKeypad"></div>
  <button class="lock-forgot" id="lockForgotBtn">Lupa PIN?</button>
</div>

<div id="app">
  <header class="app-header">
    <svg class="header-net" viewBox="0 0 400 140" preserveAspectRatio="none">
      <line x1="20" y1="30" x2="120" y2="70"/><line x1="120" y1="70" x2="220" y2="20"/>

<script>
/* ================= STORAGE KEYS ================= */
const STORE_KEY = 'wv_records_v1';
const ADMIN_PIN_KEY = 'wv_pin_v1';
const STAFF_PIN_KEY = 'wv_staff_pin_v1';
const LAST_UPDATE_KEY = 'wv_last_update_v1';
const THEME_KEY = 'wv_theme_v1';
const AUTOLOCK_KEY = 'wv_autolock_v1';
const USERNAME_KEY = 'wv_username_v1';
const LOG_KEY = 'wv_activity_log_v1';
const GDRIVE_CLIENTID_KEY = 'wv_gdrive_clientid_v1';
const GDRIVE_FILEID_KEY = 'wv_gdrive_fileid_v1';
const GDRIVE_LAST_KEY = 'wv_gdrive_last_v1';

function uid(){ return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function loadRecords(){
  try{ const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveRecords(){
  localStorage.setItem(STORE_KEY, JSON.stringify(records));
  localStorage.setItem(LAST_UPDATE_KEY, new Date().toISOString());
  renderHeaderStats();
}

let records = loadRecords();
let dataFilter = { search:'', band:'all', groupByLocation:false };
let revealed = {};
let currentRole = 'admin'; // 'admin' | 'staff' — becomes 'staff' only if unlocked with staff PIN

/* ================= ACTIVITY LOG ================= */
function loadLog(){ try{ return JSON.parse(localStorage.getItem(LOG_KEY)) || []; }catch(e){ return []; } }
function logActivity(action, detail){
  const log = loadLog();
  log.unshift({ ts:new Date().toISOString(), user: getUsername(), action, detail });
  localStorage.setItem(LOG_KEY, JSON.stringify(log.slice(0,100)));
}
function getUsername(){ return localStorage.getItem(USERNAME_KEY) || 'Pengguna'; }

/* ================= TEMPAT SAMPAH (SOFT DELETE) ================= */
const TRASH_KEY = 'wv_trash_v1';
function getTrash(){ try{ return JSON.parse(localStorage.getItem(TRASH_KEY) || '[]'); }catch(e){ return []; } }
function saveTrash(trash){ localStorage.setItem(TRASH_KEY, JSON.stringify(trash)); }
function moveToTrash(rec){
  const trash = getTrash();
  trash.unshift({ ...rec, _deletedAt: new Date().toISOString() });
  saveTrash(trash.slice(0, 200));
}
function restoreFromTrash(id){
  const trash = getTrash();
  const idx = trash.findIndex(x=>x.id===id);
  if(idx === -1) return;
  const rec = {...trash[idx]};
  delete rec._deletedAt;
  trash.splice(idx,1);
  saveTrash(trash);
  records.push(rec);
  saveRecords();
  logActivity('Pulihkan WiFi', rec.ssid);
  refreshCurrentView();
  showToast('WiFi dipulihkan dari sampah');
  openTrashManager();
}
function permanentlyDeleteTrash(id){
  if(!confirm('Hapus permanen data ini? Tidak bisa dikembalikan lagi.')) return;
  saveTrash(getTrash().filter(x=>x.id!==id));
  openTrashManager();
}
function emptyWifiTrash(){
  if(getTrash().length === 0) return;
  if(!confirm('Kosongkan seluruh sampah? Semua data di dalamnya akan terhapus permanen.')) return;
  saveTrash([]);
  logActivity('Kosongkan Sampah WiFi', '');
  openTrashManager();
}
function openTrashManager(){
  const trash = getTrash();
  const overlay = openModal(`
    <div class="close-x" id="closeTrashBtn">✕</div>
    <div class="modal-title">Tempat Sampah (${trash.length})</div>
    <div style="font-size:12px; color:var(--ink-faint); margin-bottom:10px;">Data yang dihapus disimpan di sini sampai dikosongkan manual.</div>
    <div>
      ${trash.length === 0 ? '<div class="empty-state" style="padding:20px 0;"><p>Sampah kosong.</p></div>' : trash.map(r=>`
        <div style="display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line);">
          <div style="flex:1; min-width:0;">
            <div style="font-size:13.5px; font-weight:600;">${escapeHtml(r.ssid||'(tanpa nama)')}</div>
            <div style="font-size:11px; color:var(--ink-faint);">Dihapus ${new Date(r._deletedAt).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
          </div>
          <button class="btn-secondary" style="width:auto; margin:0; padding:8px 12px;" onclick="restoreFromTrash('${r.id}')">Pulihkan</button>
          <button class="btn-secondary" style="width:auto; margin:0; padding:8px 12px; color:var(--danger);" onclick="permanentlyDeleteTrash('${r.id}')">Hapus</button>
        </div>`).join('')}
    </div>
    ${trash.length ? '<button class="btn-danger" id="emptyTrashBtn">Kosongkan Semua Sampah</button>' : ''}
  `);
  overlay.querySelector('#closeTrashBtn').addEventListener('click', () => closeModal(overlay));
  const emptyBtn = overlay.querySelector('#emptyTrashBtn');
  if(emptyBtn) emptyBtn.addEventListener('click', emptyWifiTrash);
}


/* ================= TOAST ================= */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ================= CLIPBOARD ================= */
function copyText(text, label){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast((label||'Teks') + ' disalin')).catch(()=>fallbackCopy(text,label));
  } else fallbackCopy(text,label);
}
function fallbackCopy(text,label){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showToast((label||'Teks') + ' disalin'); }catch(e){}
  document.body.removeChild(ta);
}

/* ================= HEADER STATS ================= */
function renderHeaderStats(){
  document.getElementById('statTotal').textContent = records.length;
  const locs = new Set(records.map(r => (r.lokasi||'').trim()).filter(Boolean));
  document.getElementById('statLoc').textContent = locs.size;
  document.getElementById('statBand5').textContent = records.filter(r => r.band === '5GHz' || r.band === 'Dual (2.4/5GHz)').length;
  const iso = localStorage.getItem(LAST_UPDATE_KEY);
  document.getElementById('headerUpdated').textContent = iso
    ? 'Terakhir diperbarui ' + new Date(iso).toLocaleString('id-ID', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})
    : 'Data WiFi & Password';
  const rb = document.getElementById('roleBadge');
  if(currentRole === 'staff'){ rb.style.display='inline-flex'; rb.textContent = 'Mode Staff'; }
  else if(hasAdminPin()){ rb.style.display='inline-flex'; rb.textContent = 'Admin'; }
  else { rb.style.display='none'; }
}

/* ================= TABS ================= */
function switchTab(tab){
  if(tab === 'settings' && currentRole === 'staff'){ showToast('Pengaturan hanya untuk Admin'); return; }
  document.getElementById('viewDashboard').hidden = tab !== 'dashboard';
  document.getElementById('viewData').hidden = tab !== 'data';
  document.getElementById('viewSettings').hidden = tab !== 'settings';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('fabAdd').style.display = (tab === 'settings' || currentRole === 'staff') ? 'none' : 'flex';
  if(tab === 'dashboard') renderDashboard();
  if(tab === 'data') renderData();
  if(tab === 'settings') renderSettings();
}
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

/* ================= HUB INTEGRATION (dipanggil dari index.html) ================= */
function isHubManaged(){
  return new URLSearchParams(location.search).get('hublock') === '1';
}
window.hubGoToSearch = function(query){
  switchTab('data');
  dataFilter.search = query || '';
  const inp = document.getElementById('searchInput');
  if(inp) inp.value = query || '';
  renderWifiList();
};
window.hubGetSummary = function(){
  const locs = new Set(records.map(r => (r.lokasi||'').trim()).filter(Boolean));
  return { total: records.length, locCount: locs.size };
};

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sortRecs(list){
  return list.sort((a,b) => {
    if(!!b.pinned !== !!a.pinned) return (b.pinned?1:0) - (a.pinned?1:0);
    return (a.ssid||'').localeCompare(b.ssid||'');
  });
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const el = document.getElementById('viewDashboard');
  const locCount = {};
  records.forEach(r => { const l = (r.lokasi||'Tanpa Lokasi').trim() || 'Tanpa Lokasi'; locCount[l] = (locCount[l]||0)+1; });
  const topLocs = Object.entries(locCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const pinned = sortRecs(records.filter(r => r.pinned));
  const recent = [...records].sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||'')).slice(0,4);

  el.innerHTML = `
    <div class="section-title">Ringkasan</div>
    <div class="card">
      ${records.length === 0 ? `<div class="empty-state" style="padding:20px 0;"><p>Belum ada data WiFi. ${currentRole==='admin' ? 'Ketuk tombol + untuk menambahkan yang pertama.' : ''}</p></div>` : `
        <div style="font-size:13px; color:var(--ink-soft); line-height:1.7;">
          Kamu menyimpan <b style="color:var(--ink);">${records.length}</b> jaringan WiFi
          di <b style="color:var(--ink);">${Object.keys(locCount).length}</b> lokasi berbeda.
        </div>`}
    </div>

    ${pinned.length ? `
    <div class="section-title">${ICON_STAR(true)} Favorit</div>
    <div class="wifi-list">${pinned.map(r => wifiCardHtml(r)).join('')}</div>` : ''}

    ${topLocs.length ? `
    <div class="section-title">Berdasarkan Lokasi</div>
    <div class="card" style="display:flex; flex-direction:column; gap:10px;">
      ${topLocs.map(([loc,count]) => `
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="flex:1; font-size:13px; color:var(--ink);">${escapeHtml(loc)}</div>
          <div style="font-size:12px; color:var(--ink-faint);">${count} WiFi</div>
        </div>
      `).join('')}
    </div>` : ''}

    ${recent.length ? `
    <div class="section-title">Baru Diperbarui</div>
    <div class="wifi-list">${recent.map(r => wifiCardHtml(r)).join('')}</div>` : ''}
  `;
  bindCardEvents(el);
}

/* ================= DATA VIEW ================= */
function renderData(){
  const el = document.getElementById('viewData');
  const bands = ['all', '2.4GHz', '5GHz', 'Dual (2.4/5GHz)'];
  el.innerHTML = `
    <div class="searchbar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="color:var(--ink-faint); flex-shrink:0;"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Cari nama WiFi atau lokasi..." value="${escapeHtml(dataFilter.search)}">
    </div>
    <div class="filter-row" id="bandFilterRow">
      ${bands.map(b => `<div class="chip ${dataFilter.band===b?'active':''}" data-band="${b}">${b==='all'?'Semua Band':b}</div>`).join('')}
      <div class="chip ${dataFilter.groupByLocation?'active':''}" id="groupChip">${ICON_LOCATION} Kelompokkan Lokasi</div>
      ${currentRole !== 'staff' ? `<div class="chip" id="scanAddChip">${ICON_CAMERA} Scan QR Tambah</div>` : ''}
      ${currentRole !== 'staff' ? `<div class="chip" id="bulkToggleChip">${ICON_CHECKBOX} Pilih Banyak</div>` : ''}
    </div>
    <div id="wifiBulkBar" style="display:none;"></div>
    <div class="wifi-list" id="wifiListWrap"></div>
  `;
  document.getElementById('searchInput').addEventListener('input', (e) => { dataFilter.search = e.target.value; renderWifiList(); });
  document.querySelectorAll('#bandFilterRow .chip[data-band]').forEach(c => c.addEventListener('click', () => { dataFilter.band = c.dataset.band; renderData(); }));
  document.getElementById('groupChip').addEventListener('click', () => { dataFilter.groupByLocation = !dataFilter.groupByLocation; renderData(); });

/* ================= SCAN QR UNTUK TAMBAH WIFI ================= */
let _wvScannerStream = null;
let _wvScannerRAF = null;
function parseWifiQrString(raw){
  const m = raw.match(/^WIFI:(.*);;?$/i);
  if(!m) return null;
  const body = m[1];
  const out = {};
  body.split(';').forEach(part=>{
    const idx = part.indexOf(':');
    if(idx === -1) return;
    const key = part.slice(0,idx).toUpperCase();
    let val = part.slice(idx+1).replace(/\\(.)/g, '$1');
    if(key === 'S') out.ssid = val;
    if(key === 'P') out.password = val;
    if(key === 'T') out.security = val.toUpperCase() === 'NOPASS' ? 'Tanpa Password' : (val.toUpperCase()==='WPA3'?'WPA3':(val.toUpperCase()==='WPA'?'WPA2':val));
  });
  return out.ssid ? out : null;
}
async function openWifiQrScanner(){
  const hasDetector = 'BarcodeDetector' in window;
  const hasCamera = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  if(!hasDetector){ showToast('Perangkat/browser ini tidak mendukung baca QR'); return; }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay open';
  overlay.id = 'wvScannerOverlay';
  overlay.innerHTML = `
    <div class="modal-sheet" style="max-width:480px;">
      <div class="close-x" id="wvScannerCloseX">✕</div>
      <div class="modal-title">Scan QR WiFi</div>
      <div style="font-size:12px; color:var(--ink-soft); text-align:center; margin-bottom:10px;" id="wvScannerHint">${hasCamera ? 'Arahkan kamera ke stiker QR WiFi di router' : 'Pilih foto QR WiFi dari galeri'}</div>
      ${hasCamera ? `
      <div class="scanner-wrap-wifi">
        <video id="wvScannerVideo" autoplay playsinline muted style="width:100%; border-radius:12px; background:#000; max-height:50vh; object-fit:cover;"></video>
        <div class="scanner-frame-wifi"></div>
      </div>` : ''}
      <button type="button" class="btn-secondary" id="wvScannerGalleryBtn" style="width:100%; display:flex; align-items:center; justify-content:center; gap:8px;">${ICON_GALLERY} Pilih Foto dari Galeri</button>
      <input type="file" id="wvScannerFileInput" accept="image/*" style="display:none;">
      <button type="button" class="btn-secondary" id="wvScannerCancelBtn" style="width:100%; margin-top:8px;">Batal</button>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => closeWifiQrScanner();
  overlay.querySelector('#wvScannerCloseX').addEventListener('click', close);
  overlay.querySelector('#wvScannerCancelBtn').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) close(); });

  const fileInput = overlay.querySelector('#wvScannerFileInput');
  overlay.querySelector('#wvScannerGalleryBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    await scanWifiQrFromFile(file);
  });

  if(!hasCamera) return;

  try{
    _wvScannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(e){
    document.getElementById('wvScannerHint').textContent = 'Tidak bisa mengakses kamera. Gunakan opsi pilih foto dari galeri.';
    return;
  }
  const video = document.getElementById('wvScannerVideo');
  if(!video){ _wvScannerStream.getTracks().forEach(t=>t.stop()); return; }
  video.srcObject = _wvScannerStream;

  let detector;
  try{ detector = new BarcodeDetector({ formats:['qr_code'] }); }catch(e){ detector = new BarcodeDetector(); }

  const loop = async () => {
    if(!document.getElementById('wvScannerOverlay')) return;
    try{
      const codes = await detector.detect(video);
      if(codes && codes.length){
        const raw = (codes[0].rawValue||'').trim();
        const parsed = parseWifiQrString(raw);
        if(parsed){
          showToast('QR WiFi terdeteksi: ' + parsed.ssid);
          closeWifiQrScanner();
          openFormModal(null, parsed);
          return;
        }
      }
    }catch(e){}
    _wvScannerRAF = requestAnimationFrame(loop);
  };
  _wvScannerRAF = requestAnimationFrame(loop);
}
async function scanWifiQrFromFile(file){
  const hint = document.getElementById('wvScannerHint');
  if(hint) hint.textContent = 'Membaca foto...';
  try{
    let detector;
    try{ detector = new BarcodeDetector({ formats:['qr_code'] }); }catch(e){ detector = new BarcodeDetector(); }
    const bitmap = await createImageBitmap(file);
    const codes = await detector.detect(bitmap);
    if(!codes || codes.length === 0){
      if(hint) hint.textContent = 'QR tidak terdeteksi di foto ini. Coba foto lain yang lebih jelas.';
      return;
    }
    const raw = (codes[0].rawValue||'').trim();
    const parsed = parseWifiQrString(raw);
    if(!parsed){
      if(hint) hint.textContent = 'QR ditemukan, tapi bukan format QR WiFi.';
      return;
    }
    showToast('QR WiFi terdeteksi: ' + parsed.ssid);
    closeWifiQrScanner();
    openFormModal(null, parsed);
  }catch(e){
    if(hint) hint.textContent = 'Gagal membaca foto. Coba foto lain.';
  }
}
function closeWifiQrScanner(){
  if(_wvScannerRAF) cancelAnimationFrame(_wvScannerRAF);
  _wvScannerRAF = null;
  if(_wvScannerStream){ _wvScannerStream.getTracks().forEach(t=>t.stop()); _wvScannerStream = null; }
  const overlay = document.getElementById('wvScannerOverlay');
  if(overlay) overlay.remove();
}

    exportExcel(records.filter(r=>wifiBulkSelected.has(r.id)));
    logActivity('Export Excel Terpilih', `${wifiBulkSelected.size} data`);
  });
  bar.querySelector('#wvBulkDeleteBtn').addEventListener('click', ()=>{
    if(wifiBulkSelected.size===0){ showToast('Belum ada WiFi dipilih'); return; }
    if(!confirm(`Hapus ${wifiBulkSelected.size} WiFi terpilih? Data akan dipindah ke Tempat Sampah.`)) return;
    const toDelete = records.filter(r=>wifiBulkSelected.has(r.id));
    toDelete.forEach(r=>moveToTrash(r));

    saveRecords();
    logActivity('Hapus Massal WiFi', `${toDelete.length} data`);
    wifiBulkSelected.clear();
    wifiBulkMode = false;
    renderWifiList();
    showToast(`${toDelete.length} WiFi dipindah ke Tempat Sampah`);
  });
  bar.querySelector('#wvBulkCancelBtn').addEventListener('click', toggleWifiBulkMode);
}

function openModal(innerHtml, {centered=false} = {}){

/* ================= PASSWORD GENERATOR ================= */
function generatePassword(len=14){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*';
  let out = '';
  const arr = new Uint32Array(len);
  (window.crypto || window.msCrypto).getRandomValues(arr);
  for(let i=0;i<len;i++) out += chars[arr[i] % chars.length];
  return out;
}

    if(/[^A-Za-z0-9]/.test(pw)) score++;

        rec.passwordHistory.unshift({ password: rec.password, changedAt: new Date().toISOString() });
        rec.passwordHistory = rec.passwordHistory.slice(0,10);
      }
      Object.assign(rec, data);
      logActivity('Edit WiFi', ssid);
    } else {
      data.id = uid(); data.pinned = false; data.passwordHistory = [];
      records.push(data);
      logActivity('Tambah WiFi', ssid);
    }
    saveRecords();
    closeModal(overlay);
    refreshCurrentView();
    showToast(editing ? 'WiFi diperbarui' : 'WiFi ditambahkan');
  });
  if(editing){ overlay.querySelector('#f_deleteBtn').addEventListener('click', () => { closeModal(overlay); confirmDelete(rec); }); }
}

/* ================= QR MODAL ================= */
function wifiQrString(r){
  const sec = r.security === 'Tanpa Password' ? 'nopass' : (r.security === 'WPA3' ? 'WPA' : (r.security||'WPA'));
  const esc = (s) => String(s||'').replace(/([\\;,:"])/g, '\\$1');
  return `WIFI:T:${sec};S:${esc(r.ssid)};P:${esc(r.password)};;`;
}

/* ================= EXCEL / JSON IMPORT-EXPORT ================= */
function exportExcel(list){
  if(typeof XLSX === 'undefined'){ showToast('Perlu koneksi internet untuk ekspor Excel'); return; }
  const data = list || records;
  if(data.length === 0){ showToast('Belum ada data untuk diekspor'); return; }
  const rows = data.map(r => ({
    'Nama WiFi (SSID)': r.ssid, 'Password': r.password, 'Keamanan': r.security,
    'Band': r.band, 'Lokasi': r.lokasi, 'Catatan': r.catatan,
    'Terakhir Diperbarui': r.updatedAt ? new Date(r.updatedAt).toLocaleString('id-ID') : ''
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data WiFi');
  XLSX.writeFile(wb, `WiFi_Vault_${list ? 'Terpilih_' : ''}${new Date().toISOString().slice(0,10)}.xlsx`);
  if(!list) logActivity('Ekspor Excel', `${data.length} data`);
  showToast('File Excel diunduh');
}
function importExcel(e){
  const file = e.target.files[0];
  if(!file || typeof XLSX === 'undefined') return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const wb = XLSX.read(ev.target.result, {type:'binary'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);
      let added = 0;
      rows.forEach(row => {
        const ssid = row['Nama WiFi (SSID)'] || row['SSID'] || row['Nama WiFi'];
        if(!ssid) return;
        records.push({
          id: uid(), ssid: String(ssid), password: String(row['Password']||''),
          security: row['Keamanan'] || 'WPA2', band: row['Band'] || '2.4GHz',
          lokasi: row['Lokasi'] || '', catatan: row['Catatan'] || '',
          pinned:false, passwordHistory:[], updatedAt:new Date().toISOString(), updatedBy:getUsername()
        });
        added++;
      });
      saveRecords();
      logActivity('Impor Excel', `${added} data ditambahkan`);
      refreshCurrentView(); renderSettings();
      showToast(`${added} WiFi berhasil diimpor`);
    }catch(err){ showToast('Gagal membaca file Excel'); }
  };
  reader.readAsBinaryString(file);
  e.target.value = '';
}
function exportJson(){
  const blob = new Blob([JSON.stringify({ exportedAt:new Date().toISOString(), records }, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `wifivault_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  logActivity('Ekspor JSON', `${records.length} data`);
  showToast('Backup JSON diunduh');
}
function handleImportJson(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const parsed = JSON.parse(ev.target.result);
      const incoming = Array.isArray(parsed) ? parsed : parsed.records;
      if(!Array.isArray(incoming)) throw new Error('format tidak dikenali');
      incoming.forEach(rec => { if(!rec.id) rec.id = uid(); if(!rec.passwordHistory) rec.passwordHistory=[]; });
      records = incoming;
      saveRecords();
      logActivity('Impor JSON', `${records.length} data dipulihkan`);
      refreshCurrentView(); renderSettings();
      showToast('Data berhasil dipulihkan');
    }catch(err){ showToast('Gagal membaca file backup'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ================= GOOGLE DRIVE SYNC ================= */
const GDRIVE_FILENAME = 'wifivault_backup.json';
function gdriveSync(mode){
  const clientId = localStorage.getItem(GDRIVE_CLIENTID_KEY);
  if(!clientId){ showToast('Isi Google OAuth Client ID dulu'); return; }
  if(typeof google === 'undefined' || !google.accounts){ showToast('Google Identity Services belum termuat — cek koneksi internet'); return; }
  try{
    const tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: (resp) => {
        if(resp.error){ showToast('Gagal terhubung ke Google Drive'); return; }
        if(mode === 'upload') gdriveUpload(resp.access_token);
        else gdriveDownload(resp.access_token);
      }
    });
    tokenClient.requestAccessToken();
  }catch(e){ showToast('Gagal memuat Google Identity Services'); }
}
async function gdriveFindFileId(token){
  const stored = localStorage.getItem(GDRIVE_FILEID_KEY);
  if(stored) return stored;
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${GDRIVE_FILENAME}'&spaces=drive&fields=files(id,name)`, { headers:{ Authorization:'Bearer '+token } });
  const data = await res.json();
  if(data.files && data.files.length){ localStorage.setItem(GDRIVE_FILEID_KEY, data.files[0].id); return data.files[0].id; }
  return null;
}
async function gdriveUpload(token){
  try{
    showToast('Mengunggah ke Google Drive...');
    let fileId = await gdriveFindFileId(token);
    const content = JSON.stringify({ exportedAt:new Date().toISOString(), records });
    const metadata = { name: GDRIVE_FILENAME, mimeType:'application/json' };
    const boundary = 'wvboundary';
    const body = `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
    const url = fileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const res = await fetch(url, {
      method: fileId ? 'PATCH' : 'POST',
      headers: { Authorization:'Bearer '+token, 'Content-Type': `multipart/related; boundary=${boundary}` },
      body
    });
    const data = await res.json();
    if(data.id) localStorage.setItem(GDRIVE_FILEID_KEY, data.id);
    localStorage.setItem(GDRIVE_LAST_KEY, new Date().toISOString());
    logActivity('Sinkron Google Drive', 'Unggah');
    renderSettings();
    showToast('Berhasil diunggah ke Google Drive');
  }catch(e){ showToast('Gagal mengunggah ke Google Drive'); }
}
async function gdriveDownload(token){
  try{
    const fileId = await gdriveFindFileId(token);
    if(!fileId){ showToast('Belum ada file backup di Drive'); return; }
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers:{ Authorization:'Bearer '+token } });
    const data = await res.json();
    const incoming = Array.isArray(data) ? data : data.records;
    if(!Array.isArray(incoming)) throw new Error('format salah');
    incoming.forEach(rec => { if(!rec.id) rec.id = uid(); if(!rec.passwordHistory) rec.passwordHistory=[]; });
    records = incoming;
    saveRecords();
    localStorage.setItem(GDRIVE_LAST_KEY, new Date().toISOString());
    logActivity('Sinkron Google Drive', 'Unduh');
    refreshCurrentView(); renderSettings();
    showToast('Data berhasil disinkron dari Google Drive');
  }catch(e){ showToast('Gagal mengunduh dari Google Drive'); }
}

    <div class="field"><label>PIN Baru (4 digit)</label><input type="tel" inputmode="numeric" maxlength="4" id="newPin1"></div>
    <div class="field"><label>Ulangi PIN Baru</label><input type="tel" inputmode="numeric" maxlength="4" id="newPin2"></div>
    <button type="button" class="btn-primary" id="savePinBtn">Simpan PIN</button>
    ${isSet ? '<button type="button" class="btn-danger" id="removePinBtn">Hapus PIN</button>' : ''}
  `);
  overlay.querySelector('#savePinBtn').addEventListener('click', () => {
    const p1 = overlay.querySelector('#newPin1').value.trim();
    const p2 = overlay.querySelector('#newPin2').value.trim();
    if(!/^\d{4}$/.test(p1)){ showToast('PIN harus 4 digit angka'); return; }
    if(p1 !== p2){ showToast('PIN tidak sama'); return; }
    localStorage.setItem(key, btoa(p1));
    showToast('PIN berhasil disimpan');
    closeModal(overlay); renderSettings();
  });
  if(isSet){
    overlay.querySelector('#removePinBtn').addEventListener('click', () => {
      localStorage.removeItem(key);
      showToast('PIN dihapus');
      closeModal(overlay); renderSettings();
    });
  }
}

/* ---- Lock screen keypad ---- */
let pinBuffer = '';
function renderLockDots(){
  const wrap = document.getElementById('lockDots');
  wrap.innerHTML = '';
  for(let i=0;i<4;i++){ const d = document.createElement('div'); d.className = 'lock-dot' + (i < pinBuffer.length ? ' filled' : ''); wrap.appendChild(d); }
}
function buildKeypad(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','del'];
  const wrap = document.getElementById('lockKeypad');
  wrap.innerHTML = '';
  keys.forEach(k => {
    const btn = document.createElement('button');
    if(k === ''){ btn.className = 'lock-key ghost'; btn.disabled = true; }
    else if(k === 'del'){ btn.className = 'lock-key ghost'; btn.textContent = '⌫'; btn.addEventListener('click', () => { pinBuffer = pinBuffer.slice(0,-1); renderLockDots(); }); }
    else { btn.className = 'lock-key'; btn.textContent = k; btn.addEventListener('click', () => onLockKey(k)); }
    wrap.appendChild(btn);
  });
}
function onLockKey(k){
  if(pinBuffer.length >= 4) return;
  pinBuffer += k;
  renderLockDots();
  if(pinBuffer.length === 4){
    setTimeout(() => {
      if(checkAdminPin(pinBuffer)){
        currentRole = 'admin';
        document.getElementById('lockScreen').style.display = 'none';
        pinBuffer = ''; renderLockDots();
        renderHeaderStats(); refreshCurrentView();
      } else if(checkStaffPin(pinBuffer)){
        currentRole = 'staff';
        document.getElementById('lockScreen').style.display = 'none';
        pinBuffer = ''; renderLockDots();
        renderHeaderStats(); refreshCurrentView();
        if(!document.getElementById('viewData').hidden || !document.getElementById('viewDashboard').hidden){} 
        document.getElementById('fabAdd').style.display = 'none';
      } else {
        document.getElementById('lockMsg').textContent = 'PIN salah, coba lagi';
        document.getElementById('lockDots').classList.add('shake');
        setTimeout(() => document.getElementById('lockDots').classList.remove('shake'), 350);
        pinBuffer = ''; setTimeout(renderLockDots, 200);
      }
    }, 120);
  }
}
document.getElementById('lockForgotBtn').addEventListener('click', () => {
  if(confirm('Reset PIN akan menghapus PIN Admin & Staff yang tersimpan (data WiFi tidak terpengaruh). Lanjutkan?')){
    localStorage.removeItem(ADMIN_PIN_KEY); localStorage.removeItem(STAFF_PIN_KEY);
    currentRole = 'admin';
    document.getElementById('lockScreen').style.display = 'none';
    renderHeaderStats(); refreshCurrentView();
    showToast('PIN dihapus. Atur PIN baru lewat menu Pengaturan.');
  }
});
function lockNow(){
  if(!hasAnyPin()) return;
  currentRole = 'admin';
  const lock = document.getElementById('lockScreen');
  lock.style.display = 'flex';
  buildKeypad(); renderLockDots();
  document.getElementById('lockMsg').textContent = '';
}
function initLock(){
  if(isHubManaged()){
    const role = new URLSearchParams(location.search).get('role');
    currentRole = (role === 'staff') ? 'staff' : 'admin';
    if(currentRole === 'staff') document.getElementById('fabAdd').style.display = 'none';
    renderHeaderStats();
    return;
  }
  if(hasAnyPin()){ currentRole = hasAdminPin() ? 'admin' : 'admin'; lockNow(); }
}

/* ---- Auto-lock on idle ---- */
let lastActivity = Date.now();
['click','touchstart','keydown','scroll','mousemove'].forEach(ev => document.addEventListener(ev, () => { lastActivity = Date.now(); }, {passive:true}));
setInterval(() => {
  if(isHubManaged()) return;
  const minutes = parseInt(localStorage.getItem(AUTOLOCK_KEY) || '0', 10);
  if(minutes > 0 && hasAnyPin() && document.getElementById('lockScreen').style.display !== 'flex'){
    if(Date.now() - lastActivity > minutes * 60000) lockNow();
  }
}, 15000);

/* ================= INIT ================= */
renderHeaderStats();
switchTab('dashboard');
initLock();
</script>
